name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            builder_args: --win
          - os: macos-latest
            platform: mac
            builder_args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      # Build only — do NOT let electron-builder publish (it creates duplicate drafts).
      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.builder_args }} --publish never

      - name: Upload Windows artifacts
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/MiruroRPC-Setup-*.exe
            dist/MiruroRPC-Setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: Upload macOS artifacts
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/MiruroRPC-*.dmg
            dist/MiruroRPC-*.zip
            dist/MiruroRPC-*.zip.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: release

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos
          path: release

      - name: Publish single GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release/MiruroRPC-Setup-*.exe
            release/MiruroRPC-Setup-*.exe.blockmap
            release/latest.yml
            release/MiruroRPC-*.dmg
            release/MiruroRPC-*.zip
            release/MiruroRPC-*.zip.blockmap
            release/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
