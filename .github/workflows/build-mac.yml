name: Build macOS (test)

on:
  push:
    branches:
      - mac-support
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Both arches — macos-latest is arm64 and otherwise only builds host arch.
        run: npx electron-builder --mac dmg --x64 --arm64 --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mirurorpc-macos
          path: dist/MiruroRPC-*.dmg
          if-no-files-found: error
          retention-days: 14
